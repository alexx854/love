<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>До встречи</title>
  <meta name="theme-color" content="#ff4d88" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Inter, system-ui, sans-serif; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: linear-gradient(135deg, #ff4d88, #ff9a8b 55%, #ffd36e);
      position: relative;
      padding: 18px;
    }
    .hearts { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
    .heart { position: absolute; bottom: -40px; color: rgba(255,255,255,.78); font-size: 18px; animation: floatUp linear infinite; user-select: none; }
    @keyframes floatUp {
      0% { transform: translateY(0) translateX(0) rotate(0deg) scale(.8); opacity: 0; }
      12% { opacity: 1; }
      50% { transform: translateY(-55vh) translateX(18px) rotate(18deg) scale(1.08); }
      100% { transform: translateY(-120vh) translateX(-18px) rotate(-10deg) scale(1.4); opacity: 0; }
    }
    .card {
      width: min(92vw, 640px);
      padding: 34px 24px 28px;
      border-radius: 30px;
      background: rgba(255,255,255,.18);
      border: 1px solid rgba(255,255,255,.28);
      backdrop-filter: blur(18px);
      box-shadow: 0 20px 80px rgba(66, 18, 41, 0.25);
      color: white;
      text-align: center;
      position: relative;
      z-index: 2;
    }
    h1 {
      font-size: clamp(28px, 5vw, 44px);
      line-height: 1.15;
      margin-bottom: 20px;
    }
    .heart-big {
      font-size: 96px;
      line-height: 1;
      animation: beat 1.2s ease-in-out infinite;
      text-shadow: 0 0 24px rgba(255,255,255,.25);
    }
    @keyframes beat {
      0%, 100% { transform: scale(1); }
      25% { transform: scale(1.12); }
      50% { transform: scale(0.98); }
      75% { transform: scale(1.18); }
    }
    .back {
      margin-top: 18px;
      display: inline-block;
      color: white;
      text-decoration: none;
      opacity: .92;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="hearts" id="hearts"></div>

  <main class="card">
    <h1>Запомнил. До встречи, любовь моя</h1>
    <div class="heart-big">💖</div>
  </main>

  <script>
    const hearts = document.getElementById("hearts");
    for (let i = 0; i < 26; i++) {
      const h = document.createElement("div");
      h.className = "heart";
      h.textContent = Math.random() > 0.5 ? "♥" : "❤";
      h.style.left = Math.random() * 100 + "vw";
      h.style.fontSize = (14 + Math.random() * 26) + "px";
      h.style.animationDuration = (6 + Math.random() * 8) + "s";
      h.style.animationDelay = (-Math.random() * 10) + "s";
      hearts.appendChild(h);
    }
  </script>
</body>
</html>
